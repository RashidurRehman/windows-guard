<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Windows Guard badge</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      #badge {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      #badge svg {
        width: 20px;
        height: 20px;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.55));
        transition: transform 0.1s ease;
      }
      #badge:hover svg { transform: scale(1.15); }
      #dot {
        position: absolute;
        bottom: 3px;
        right: 3px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.4);
        background: #6b7787;
      }
    </style>
  </head>
  <body>
    <div id="badge" title="Windows Guard">
      <svg viewBox="0 0 24 24" fill="#e7ecf3" stroke="#e7ecf3" stroke-width="0.5">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
      </svg>
      <div id="dot"></div>
    </div>
    <script type="module">
      import { invoke } from "@tauri-apps/api/core";
      import { listen } from "@tauri-apps/api/event";

      const dot = document.getElementById("dot");
      const COLORS = {
        protected: "#3ddc97",
        partial: "#f5b544",
        unprotected: "#ff6b6b",
        "not-running": "#6b7787",
      };

      listen("badge-status", (e) => {
        const status = e.payload?.status || "not-running";
        dot.style.background = COLORS[status] || COLORS["not-running"];
        document.getElementById("badge").title = e.payload?.label || "Windows Guard";
      });

      document.getElementById("badge").addEventListener("click", () => {
        invoke("focus_main_window");
      });
    </script>
  </body>
</html>
