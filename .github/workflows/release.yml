name: release

# Push a tag like "v0.2.0" (matching the version in src-tauri/tauri.conf.json)
# to build, sign, and publish a GitHub Release with the installer + latest.json
# that the in-app updater checks against.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Import code-signing certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          $pfxPath = Join-Path $env:RUNNER_TEMP "windows-guard.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $securePw = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePw | Out-Null
          Remove-Item $pfxPath

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Windows Guard v__VERSION__"
          releaseBody: "See the assets below to download this version. The app also updates itself automatically."
          releaseDraft: false
          prerelease: false
